---
kind: Service
apiVersion: v1
metadata:
  name: ubuntu-com-security-api
spec:
  selector:
    app: ubuntu-com-security-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ubuntu-com-security-api
spec:
  replicas: 8
  selector:
    matchLabels:
      app: ubuntu-com-security-api
  template:
    metadata:
      labels:
        app: ubuntu-com-security-api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ubuntu-com-security-api
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: ubuntu-com-security-api
          image: prod-comms.ps5.docker-registry.canonical.com/ubuntu-com-security-api:${TAG_TO_DEPLOY}

          ports:
            - name: http
              containerPort: 80

          env:
            - name: TALISKER_NETWORKS
              value: 10.0.0.0/8

            - name: SENTRY_DSN
              value: "https://88233b54cb8e9f8d8df4ace2349e0b8b@o4510662863749120.ingest.de.sentry.io/4511652407345232"

            - name: GUNICORN_TIMEOUT
              value: "30"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: ubuntu-com-security-api
                  name: secret-keys

            - name: HTTP_PROXY
              value: "http://squid.internal:3128/"

            - name: HTTPS_PROXY
              value: "http://squid.internal:3128/"

            - name: NO_PROXY
              value: ".internal,ubuntu.com,.ubuntu.com,snapcraft.io,.snapcraft.io,jujucharms.com,.jujucharms.com,maas.io,.maas.io,conjure-up.io,.conjure-up.io,netplan.io,.netplan.io,canonical.com,.canonical.com,launchpad.net,.launchpad.net,linuxcontainers.org,.linuxcontainers.org,cloud-init.io,.cloud-init.io,vanillaframework.io,.vanillaframework.io,anbox-cloud.io,.anbox-cloud.io,juju.is,.juju.is,dqlite.io,.dqlite.io,charmhub.io,.charmhub.io"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: database-url
                  name: usndbreplica

          # /_status/check touches no database but still needs a free gunicorn
          # worker. Sync workers serve one request each, so enough concurrent
          # slow requests starve the probe and the pod is dropped from the
          # Service while healthy - the 503s nginx surfaced. --workers 5 (was
          # 3) widens the margin without removing it. These values tolerate
          # transient starvation; they do not replace keeping responses small.
          readinessProbe:
            httpGet:
              path: /_status/check
              port: 80
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5

          resources:
            requests:
              ephemeral-storage: 128Mi
              # Observed steady state is 260-510Mi per pod.
              memory: 512Mi
              # Without a CPU request these pods are best-effort and lose to
              # any pod that declares one. Serialising 12-24MB of JSON is
              # CPU-bound, which lengthened the slow requests that starve the
              # probe. Observed 47-762m. No CPU limit on purpose - a limit
              # throttles bursts, the opposite of what this needs.
              cpu: 500m
            limits:
              ephemeral-storage: 1Gi
              # Raised from 1G after an OOMKill: marshmallow's intermediate
              # dicts cost several times the 12-24MB payload, so concurrent
              # large responses exceeded 1G and the restart turned a slow
              # endpoint into a restart loop. 2G is ~4x the observed peak.
              memory: 2G

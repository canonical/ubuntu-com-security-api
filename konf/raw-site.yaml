---
kind: Service
apiVersion: v1
metadata:
  name: ubuntu-com-security-api
spec:
  selector:
    app: ubuntu-com-security-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ubuntu-com-security-api
spec:
  replicas: 8
  selector:
    matchLabels:
      app: ubuntu-com-security-api
  template:
    metadata:
      labels:
        app: ubuntu-com-security-api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ubuntu-com-security-api
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: ubuntu-com-security-api
          image: prod-comms.ps5.docker-registry.canonical.com/ubuntu-com-security-api:${TAG_TO_DEPLOY}

          ports:
            - name: http
              containerPort: 80

          env:
            - name: TALISKER_NETWORKS
              value: 10.0.0.0/8

            - name: SENTRY_DSN
              value: "https://88233b54cb8e9f8d8df4ace2349e0b8b@o4510662863749120.ingest.de.sentry.io/4511652407345232"

            - name: GUNICORN_TIMEOUT
              value: "30"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: ubuntu-com-security-api
                  name: secret-keys

            - name: HTTP_PROXY
              value: "http://squid.internal:3128/"

            - name: HTTPS_PROXY
              value: "http://squid.internal:3128/"

            - name: NO_PROXY
              value: ".internal,ubuntu.com,.ubuntu.com,snapcraft.io,.snapcraft.io,jujucharms.com,.jujucharms.com,maas.io,.maas.io,conjure-up.io,.conjure-up.io,netplan.io,.netplan.io,canonical.com,.canonical.com,launchpad.net,.launchpad.net,linuxcontainers.org,.linuxcontainers.org,cloud-init.io,.cloud-init.io,vanillaframework.io,.vanillaframework.io,anbox-cloud.io,.anbox-cloud.io,juju.is,.juju.is,dqlite.io,.dqlite.io,charmhub.io,.charmhub.io"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: database-url
                  name: usndbreplica

          # /_status/check returns a static string and touches no database,
          # but it still needs a free gunicorn worker. With --workers 3 (sync),
          # three slow requests leave nothing to answer it, and the pod gets
          # pulled from the Service while perfectly healthy - which is what
          # nginx surfaced as 503s. These values tolerate transient starvation
          # instead of ejecting the pod; they are not a substitute for keeping
          # responses small.
          readinessProbe:
            httpGet:
              path: /_status/check
              port: 80
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5

          resources:
            requests:
              ephemeral-storage: 128Mi
              # Observed steady-state is 260-510Mi per pod, so reserve enough
              # that the scheduler accounts for real usage.
              memory: 512Mi
              # There was previously no CPU request at all, which makes these
              # pods best-effort for CPU: under node contention they lose to
              # any pod that declares one. Serialising 12-24MB of JSON is
              # CPU-bound, so that directly lengthened the slow requests that
              # starve the readiness probe. Observed usage is 47-762m.
              #
              # Deliberately no CPU *limit* - a limit throttles bursts, which
              # is the opposite of what a latency-sensitive endpoint needs.
              cpu: 500m
            limits:
              ephemeral-storage: 1Gi
              # Raised from 1G after an OOMKill. /security/cves.json can emit
              # 12-24MB of JSON, and marshmallow's intermediate dicts cost
              # several times the final payload, so concurrent large responses
              # exceeded 1G and the kernel killed the container - which then
              # restarted, turning a slow endpoint into a restart loop.
              #
              # 2G is ~4x the observed peak. Sized to measurement rather than
              # guesswork; revisit if payloads are ever trimmed.
              memory: 2G

---
kind: Service
apiVersion: v1
metadata:
  name: ubuntu-com-security-api-updates
spec:
  selector:
    app: ubuntu-com-security-api-updates
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: ubuntu-com-security-api-updates
spec:
  serviceName: ubuntu-com-security-api-updates
  replicas: 2
  selector:
    matchLabels:
      app: ubuntu-com-security-api-updates
  template:
    metadata:
      labels:
        app: ubuntu-com-security-api-updates
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ubuntu-com-security-api-updates
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: ubuntu-com-security-api-updates
          image: prod-comms.ps5.docker-registry.canonical.com/ubuntu-com-security-api:${TAG_TO_DEPLOY}

          ports:
            - name: http
              containerPort: 80

          env:
            - name: TALISKER_NETWORKS
              value: 10.0.0.0/8

            - name: GUNICORN_TIMEOUT
              value: "300"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: ubuntu-com-security-api
                  name: secret-keys

            - name: HTTP_PROXY
              value: "http://squid.internal:3128/"

            - name: HTTPS_PROXY
              value: "http://squid.internal:3128/"

            - name: NO_PROXY
              value: ".internal,ubuntu.com,.ubuntu.com,snapcraft.io,.snapcraft.io,jujucharms.com,.jujucharms.com,maas.io,.maas.io,conjure-up.io,.conjure-up.io,netplan.io,.netplan.io,canonical.com,.canonical.com,launchpad.net,.launchpad.net,linuxcontainers.org,.linuxcontainers.org,cloud-init.io,.cloud-init.io,vanillaframework.io,.vanillaframework.io,anbox-cloud.io,.anbox-cloud.io,juju.is,.juju.is,dqlite.io,.dqlite.io,charmhub.io,.charmhub.io"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: prod-database-url2
                  name: usndbreplica

            - name: OAUTH_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  key: ubuntu-com-security-api
                  name: token-salts
                  
            - name: REQUEST_TOKENS_FILE
              value: "/etc/ubuntu-com-security-api/request-tokens"

            - name: SENTRY_DSN
              value: "https://88233b54cb8e9f8d8df4ace2349e0b8b@o4510662863749120.ingest.de.sentry.io/4511652407345232"

          # /_status/check touches no database but still needs a free gunicorn
          # worker; enough concurrent slow requests starve the probe and drop
          # the pod from the Service while healthy. Rationale in raw-site.yaml.
          # This workload serves the bulk CVE upsert, where 5 workers would
          # mean 5 concurrent multi-megabyte write transactions per pod;
          # limit_concurrency("cve-upsert", 1) in views.py caps that at one.
          readinessProbe:
            httpGet:
              path: /_status/check
              port: 80
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5

          resources:
            requests:
              memory: 512Mi
              # Without a CPU request these pods are best-effort and lose to
              # any pod that declares one. No CPU limit - it throttles bursts.
              cpu: 500m
            limits:
              memory: 2G

          volumeMounts:
          - mountPath: /etc/ubuntu-com-security-api/
            name: www
            
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: cdk-cinder
      resources:
        requests:
          storage: 1Gi

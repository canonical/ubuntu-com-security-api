name: Deploy to PS7
description: Deploy the ubuntu-com-security-api charm to a ProdStack 7 Juju model using JAAS OAuth credentials.

inputs:
    image-url:
        description: "Full GHCR image URL to deploy as the flask-app-image resource"
        required: true
    app-name:
        description: "Juju application name"
        required: true
    publish-app-name:
        description: "Juju application that serves /security/updates. It is refreshed if it exists, and never created."
        required: false
        default: ""
    read-app-config:
        description: "Config (key=value ...) for app-name, applied when the publish app exists"
        required: false
        default: "run-migrations=false webserver-timeout=90"
    publish-app-config:
        description: "Config (key=value ...) for publish-app-name"
        required: false
        default: "run-migrations=true webserver-timeout=300"
    smoke-test-url:
        description: "Base URL of the deployed API. Empty skips the smoke test."
        required: false
        default: ""
    controller-name:
        description: "Juju controller name"
        required: true
    controller-address:
        description: "Juju controller address for juju login"
        required: true
    model-name:
        description: "Juju model short name"
        required: true
    juju-version:
        description: "Juju snap channel"
        required: false
        default: "3/stable"
    juju-client-id:
        description: "JAAS OAuth client id"
        required: true
    juju-client-secret:
        description: "JAAS OAuth client secret"
        required: true

runs:
    using: composite
    steps:
        - name: Install Juju
          shell: bash
          env:
              JUJU_VERSION: ${{ inputs.juju-version }}
          run: sudo snap install juju --channel="$JUJU_VERSION"

        - name: Download charm artifact
          uses: actions/download-artifact@v8
          with:
              name: ${{ inputs.app-name }}-charm

        - name: Authenticate with JAAS
          shell: bash
          env:
              JUJU_CLIENT_ID: ${{ inputs.juju-client-id }}
              JUJU_CLIENT_SECRET: ${{ inputs.juju-client-secret }}
              JUJU_CONTROLLER_ADDRESS: ${{ inputs.controller-address }}
              JUJU_CONTROLLER_NAME: ${{ inputs.controller-name }}
          run: |
              set -e
              juju login "$JUJU_CONTROLLER_ADDRESS" -c "$JUJU_CONTROLLER_NAME"

        - name: Switch to model
          shell: bash
          env:
            JUJU_CLIENT_ID: ${{ inputs.juju-client-id }}
            JUJU_CLIENT_SECRET: ${{ inputs.juju-client-secret }}
            JUJU_CONTROLLER_NAME: ${{ inputs.controller-name }}
            JUJU_MODEL_NAME: ${{ inputs.model-name }}
          run: |
            set -euo pipefail
            FULL_MODEL=$(juju models -c "$JUJU_CONTROLLER_NAME" --format json | jq -r --arg model "$JUJU_MODEL_NAME" '.models[] | select(."short-name" == $model) | .name' | head -n1)
            if [ -z "$FULL_MODEL" ]; then echo "::error::Model '$JUJU_MODEL_NAME' not found on controller '$JUJU_CONTROLLER_NAME'."; exit 1; fi
            juju switch "$JUJU_CONTROLLER_NAME:${FULL_MODEL}"

        - name: Deploy charm
          id: deploy
          shell: bash
          env:
              JUJU_CLIENT_ID: ${{ inputs.juju-client-id }}
              JUJU_CLIENT_SECRET: ${{ inputs.juju-client-secret }}
              APP_NAME: ${{ inputs.app-name }}
              PUBLISH_APP_NAME: ${{ inputs.publish-app-name }}
              READ_APP_CONFIG: ${{ inputs.read-app-config }}
              PUBLISH_APP_CONFIG: ${{ inputs.publish-app-config }}
              IMAGE_URL: ${{ inputs.image-url }}
          run: bash "$GITHUB_ACTION_PATH/deploy.sh"

        - name: Smoke test
          if: inputs.smoke-test-url != ''
          shell: bash
          env:
              BASE_URL: ${{ inputs.smoke-test-url }}
              CHECK_PUBLISH: ${{ steps.deploy.outputs.publish-app-deployed }}
          run: bash "$GITHUB_ACTION_PATH/smoke-test.sh"
